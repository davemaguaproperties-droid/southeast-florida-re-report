name: SSi-AI CUDA regression

on:
  push:
    branches: [main]
    paths:
      - "ci/ssi-ai/**"
      - ".github/workflows/ssi-ai-cuda.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

# Required for the optional history-persistence job.
permissions:
  contents: write

jobs:
  cuda-regression:
    name: CUDA correctness and benchmark
    # Register the host with all four labels, or adjust this list to your labels.
    runs-on: [self-hosted, linux, x64, cuda, gpu]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect GPU and driver
        run: |
          nvidia-smi
          python3 --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CUDA-enabled Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Match this wheel index to the host driver supported by your runner.
          python -m pip install torch matplotlib \
            --index-url https://download.pytorch.org/whl/cu124

      - name: Verify CUDA is usable
        run: |
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.device_count() else "no CUDA device"
          print("torch:", torch.__version__)
          print("device:", torch.cuda.get_device_name(0))
          print("capability:", torch.cuda.get_device_capability(0))
          PY

      - name: Run SSi-AI checks and CUDA benchmark
        run: |
          python ci/ssi-ai/scripts/ssi_daily.py \
            --mode all \
            --device cuda \
            --batch-size 1 \
            --d-model 128 \
            --n-heads 4 \
            --window-size 32 \
            --chunk-size 64 \
            --num-sink-tokens 2 \
            --seq-lengths 128 256 512 1024 2048 \
            --warmups 3 \
            --iterations 10 \
            --compare-dense \
            --max-dense-seq-len 1024 \
            --plot \
            --output-dir artifacts/current

      - name: Fetch prior result history branch
        run: |
          mkdir -p artifacts/history
          if git ls-remote --exit-code --heads origin ssi-ai-history >/dev/null 2>&1; then
            git fetch origin ssi-ai-history
            git archive origin/ssi-ai-history history/ | tar -x --strip-components=1 -C artifacts/history
          fi

      - name: Check rolling-median regression
        id: regression
        continue-on-error: true
        run: |
          set +e
          python ci/ssi-ai/scripts/check_rolling_regression.py \
            --current artifacts/current/results.json \
            --history-glob 'artifacts/history/**/*.json' \
            --output artifacts/current/regression_report.json \
            --metric local_ms \
            --threshold 0.25 \
            --improvement-threshold 0.10 \
            --min-samples 3 \
            --min-absolute-ms 0.05 \
            --max-seq-len 2048
          code=$?
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/current/regression_report.json").read_text())
          print(f"regressions={len(report.get('regressions', []))}")
          print(f"improvements={len(report.get('improvements', []))}")
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Build notification summary
        id: summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/current/regression_report.json").read_text())
          lines = ["*SSi-AI CUDA performance update*", f"Workflow: {__import__('os').environ.get('GITHUB_SERVER_URL')}/{__import__('os').environ.get('GITHUB_REPOSITORY')}/actions/runs/{__import__('os').environ.get('GITHUB_RUN_ID')}"]
          for key, label in (("regressions", "Regression"), ("improvements", "Improvement")):
              for row in report.get(key, []):
                  lines.append(f"{label}: seq={row['seq_len']} current={row['current_ms']:.3f} ms, median={row['historical_median_ms']:.3f} ms")
          Path("artifacts/current/notification.txt").write_text("\n".join(lines) + "\n")
          print("summary_written=true")
          PY

      - name: Notify Slack of performance change
        if: always() && env.SLACK_WEBHOOK_URL != '' && (steps.regression.outputs.regressions != '0' || steps.regression.outputs.improvements != '0')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<'PY' > /tmp/slack_payload.json
          import json
          from pathlib import Path
          print(json.dumps({"text": Path("artifacts/current/notification.txt").read_text()}))
          PY
          curl --fail --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            --data @/tmp/slack_payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Fail job on performance regression
        if: always() && steps.regression.outputs.regressions != '0'
        run: |
          echo "SSi-AI CUDA performance regression detected. See artifacts/current/regression_report.json."
          exit 1

      - name: Upload CUDA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssi-ai-cuda-${{ github.run_id }}
          path: artifacts/current/
          if-no-files-found: error

  persist-history:
    name: Persist benchmark history
    needs: cuda-regression
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, cuda, gpu]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: ssi-ai-cuda-${{ github.run_id }}
          path: artifacts/current

      - name: Append result to history branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ssi-ai-history >/dev/null 2>&1; then
            git fetch origin ssi-ai-history
            git checkout -B ssi-ai-history origin/ssi-ai-history
          else
            git checkout --orphan ssi-ai-history
            git rm -rf . || true
          fi
          mkdir -p history
          cp artifacts/current/results.json "history/${RUN_ID}.json"
          # Keep the most recent 30 results to bound repository size.
          find history -type f -name '*.json' -printf '%T@ %p\n' | sort -nr | tail -n +31 | cut -d' ' -f2- | xargs -r rm -f
          git add history
          git commit -m "ci: record SSi-AI CUDA benchmark ${RUN_ID}" || exit 0
          git push origin ssi-ai-history
